<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow</title>
  <link rel="stylesheet" href="style.css" />
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="app-header">
    <h1>TaskFlow</h1>
  </header>

  <main class="app">
    <form id="task-form" class="task-form">
      <label for="task-input" class="visually-hidden">New task</label>
      <input
        id="task-input"
        type="text"
        placeholder="What needs doing?"
        maxlength="100"
        autocomplete="off"
      />
      <button type="submit">Add</button>
    </form>
    <p id="form-error" class="error" role="alert"></p>

    <div class="filters" role="group" aria-label="Filter tasks">
      <button type="button" data-filter="all" aria-pressed="true">All</button>
      <button type="button" data-filter="active" aria-pressed="false">Active</button>
      <button type="button" data-filter="completed" aria-pressed="false">Completed</button>
    </div>

    <p id="status" class="status" aria-live="polite">Loading…</p>

    <ul id="task-list" class="task-list">
      <!-- Hard-coded samples for milestone 1. JavaScript will replace these later. -->
      <li class="task" data-id="1">
        <input type="checkbox" id="task-1" />
        <label for="task-1">Finish CSS layout</label>
        <button type="button" class="edit-btn" aria-label="Edit task: Finish CSS layout">Edit</button>
        <button type="button" class="delete-btn" aria-label="Delete task: Finish CSS layout">Delete</button>
      </li>
      <li class="task completed" data-id="2">
        <input type="checkbox" id="task-2" checked />
        <label for="task-2">Create Firebase project</label>
        <button type="button" class="edit-btn" aria-label="Edit task: Create Firebase project">Edit</button>
        <button type="button" class="delete-btn" aria-label="Delete task: Create Firebase project">Delete</button>
      </li>
    </ul>
  </main>

  <footer class="app-footer">
    <p id="counter" aria-live="polite">1 task left</p>
  </footer>
</body>
</html>
