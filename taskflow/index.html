<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow</title>
  <link rel="stylesheet" href="style.css" />
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="app-header">
    <h1>TaskFlow</h1>
  </header>

  <main class="app">
    <form id="task-form" class="task-form">
      <label for="task-input" class="visually-hidden">New task</label>
      <input
        id="task-input"
        type="text"
        placeholder="What needs doing?"
        maxlength="100"
        autocomplete="off"
      />
      <button type="submit">Add</button>
    </form>
    <p id="form-error" class="error" role="alert"></p>

    <div class="filters" role="group" aria-label="Filter tasks">
      <button type="button" data-filter="all" aria-pressed="true">All</button>
      <button type="button" data-filter="active" aria-pressed="false">Active</button>
      <button type="button" data-filter="completed" aria-pressed="false">Completed</button>
    </div>

    <p id="status" class="status" aria-live="polite">Loading…</p>

    <ul id="task-list" class="task-list"></ul>
  </main>

  <footer class="app-footer">
    <p id="counter" aria-live="polite">0 tasks left</p>
  </footer>
</body>
</html>
